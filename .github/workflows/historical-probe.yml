name: Probe historical Bybit data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'historical_probe.py'
      - '.github/workflows/historical-probe.yml'
  schedule:
    - cron: '43 3 * * 0'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx==0.28.1
      - name: Verify Render historical sample alignment
        run: |
          python - <<'PY'
          import httpx, json, sys, time
          base = 'https://futures-trading-ai-v1.onrender.com'
          try:
              with httpx.Client(timeout=35, follow_redirects=True) as c:
                  def fetch(path, params=None):
                      for attempt in range(5):
                          try:
                              response = c.get(base + path, params=params)
                              if response.status_code in (502, 503, 504) and attempt < 4:
                                  time.sleep(8 * (attempt + 1))
                                  continue
                              response.raise_for_status()
                              return response
                          except (httpx.ConnectError, httpx.ReadTimeout):
                              if attempt == 4:
                                  raise
                              time.sleep(8 * (attempt + 1))
                      raise RuntimeError('Render unavailable after retries')
                  health = fetch('/health')
                  results = {}
                  for symbol in ('BTCUSDT', 'ETHUSDT'):
                      r = fetch('/historical-probe', params={'symbol': symbol, 'days_ago': 30})
                      results[symbol] = r.json()
                  print(json.dumps({'health': health.status_code, 'probes': results}, indent=2))
                  if not all(v.get('historical_sample_aligned') for v in results.values()):
                      sys.exit('Historical OI/funding/price samples are not all aligned')
          except httpx.HTTPError as exc:
              sys.exit('Render historical probe unavailable: ' + str(exc))
          PY
      - name: Probe historical market data directly (diagnostic only)
        if: always()
        run: |
          set -o pipefail
          python historical_probe.py | tee historical-probe-result.json
      - name: Upload diagnostic results
        uses: actions/upload-artifact@v4
        with:
          name: historical-probe-result
          path: historical-probe-result.json
          retention-days: 7
