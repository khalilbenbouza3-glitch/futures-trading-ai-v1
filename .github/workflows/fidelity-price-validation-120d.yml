name: V2.10 production price-validation fidelity 120d
on:
  push:
    paths:
      - '.github/workflows/fidelity-price-validation-120d.yml'
  workflow_dispatch:

jobs:
  fidelity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - symbol: BTCUSDT
            base: https://futures-backtest-btc-final.onrender.com
          - symbol: ETHUSDT
            base: https://futures-backtest-chunks.onrender.com
    runs-on: ubuntu-latest
    env:
      ANCHOR_MS: 1791680400000
      MAX_ENTRY_DRIFT_R: 0.35
    steps:
      - name: Wait for fidelity API
        env:
          BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          version=""
          for i in $(seq 1 100); do
            version=$(curl --retry 2 --retry-all-errors -fsS "$BASE/openapi.json" 2>/dev/null | jq -r '.info.version // empty' || true)
            echo "api_version=${version:-unavailable} poll=$i"
            [ "$version" = "1.5" ] && break
            sleep 5
          done
          test "$version" = "1.5"

      - name: Run four contiguous fidelity chunks
        env:
          BASE: ${{ matrix.base }}
          SYMBOL: ${{ matrix.symbol }}
        run: |
          set -euo pipefail
          mkdir -p reports
          echo "$ANCHOR_MS" > reports/anchor_ms.txt
          busy=-1
          for end_days in 91 61 31 1; do
            out="reports/${SYMBOL}_${end_days}.json"
            echo "START $SYMBOL end_days_ago=$end_days busy=$busy"
            curl --retry 5 --retry-all-errors -fsS -X POST \
              "$BASE/fidelity/start?symbol=$SYMBOL&days=30&end_days_ago=$end_days&initial_busy_until_ms=$busy&anchor_ms=$ANCHOR_MS&max_entry_drift_r=$MAX_ENTRY_DRIFT_R" > start.json
            cat start.json
            test "$(jq -r '.status' start.json)" = "running"
            done_flag=0
            for i in $(seq 1 100); do
              sleep 15
              curl --retry 5 --retry-all-errors -fsS "$BASE/fidelity/status" > status.json
              st=$(jq -r '.status' status.json)
              echo "$SYMBOL end_days_ago=$end_days poll=$i status=$st"
              if [ "$st" = "finished" ]; then
                cp status.json "$out"
                jq -e '.report.status == "REPLAYED"' "$out" >/dev/null
                jq -e '([.report.coverage[] | .missing] | add) == 0' "$out" >/dev/null
                jq -e '.report.skipped_no_funding == 0 and .report.skipped_warmup == 0' "$out" >/dev/null
                jq -e '.report.production_price_validation.enabled == true' "$out" >/dev/null
                jq -e '.report.production_price_validation.max_entry_drift_r == 0.35' "$out" >/dev/null
                jq -e --argjson a "$ANCHOR_MS" '.report.anchor_ms == $a' "$out" >/dev/null
                done_flag=1
                break
              fi
              if [ "$st" = "error" ]; then cat status.json; exit 10; fi
            done
            test "$done_flag" = "1"
            busy=$(jq -r '.report.final_busy_until_ms' "$out")
          done

      - name: Aggregate fidelity result
        env:
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          import json, pathlib, collections, os
          p=pathlib.Path('reports'); sym=os.environ['SYMBOL']
          rs=[json.loads((p/f'{sym}_{e}.json').read_text())['report'] for e in (91,61,31,1)]
          for a,b in zip(rs,rs[1:]): assert a['end_ms']==b['start_ms']
          assert rs[-1]['end_ms']-rs[0]['start_ms']==120*86_400_000
          trades=sorted([t for r in rs for t in r['trades'] if t['status']=='closed'], key=lambda t:t['signal_time_ms'])
          rets=[t['net_return_including_funding'] for t in trades]
          eq=1.0; peak=1.0; dd=0.0
          for x in rets:
              eq*=1+x; peak=max(peak,eq); dd=max(dd,1-eq/peak)
          pos=sum(x for x in rets if x>0); neg=-sum(x for x in rets if x<0)
          pv=[r['production_price_validation'] for r in rs]
          out={
            'symbol':sym,'window_days':120,'anchor_ms':rs[0]['anchor_ms'],
            'start_iso':rs[0]['start_iso'],'end_iso':rs[-1]['end_iso'],
            'signals_before_execution':sum(r['signals'] for r in rs),
            'closed_trades':len(trades),'wins':sum(x>0 for x in rets),
            'win_rate':sum(x>0 for x in rets)/len(rets) if rets else None,
            'mean_net_return_with_funding':sum(rets)/len(rets) if rets else None,
            'arithmetic_sum_net_returns':sum(rets),
            'profit_factor_return_units':pos/neg if neg else None,
            'compounded_full_notional_sequential_illustration':eq-1,
            'max_drawdown_full_notional_sequential_illustration':dd,
            'skipped_overlapping_signals':sum(r['skipped_overlapping_signals'] for r in rs),
            'price_validation_rejected_too_far':sum(x['rejected_price_too_far'] for x in pv),
            'price_validation_rejected_crossed_stop':sum(x['rejected_stop_already_crossed'] for x in pv),
            'read_only':True,
          }
          (p/f'{sym}_fidelity_summary.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.symbol }}-v210-fidelity-120d
          path: reports/
