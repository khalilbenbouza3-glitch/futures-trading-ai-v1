name: Backtest execution unit tests
on:
  push:
    paths:
      - 'backtest_execution.py'
      - 'historical_replay.py'
      - 'historical_coverage.py'
      - 'test_backtest_execution.py'
      - '.github/workflows/backtest-tests.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check historical modules
        run: python -m py_compile backtest_execution.py test_backtest_execution.py historical_replay.py historical_coverage.py
      - name: Run execution tests
        run: python -m unittest -v test_backtest_execution.py
