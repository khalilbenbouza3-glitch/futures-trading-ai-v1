name: Evaluation engine tests
on:
  push:
    paths:
      - 'evaluation.py'
      - 'tests/**'
      - '.github/workflows/evaluation-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run conservative evaluator tests
        run: python -m unittest discover -s tests -v
