name: Evaluate archived market scan
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Optional scheduled scanner workflow run ID'
        required: false
        type: string
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: archived-scan-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx==0.28.1
      - name: Find mature archived scan and download its artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, time
          from datetime import datetime, timezone
          requested=os.getenv("REQUESTED_RUN_ID","").strip()
          if requested:
              ids=[requested]
          else:
              cmd=["gh","api",f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/scheduled-scan.yml/runs",
                   "-f","status=success","-f","per_page=100","--method","GET"]
              runs=json.loads(subprocess.check_output(cmd,text=True))["workflow_runs"]
              now=time.time()
              mature=[x for x in runs if now-datetime.fromisoformat(x["created_at"].replace("Z","+00:00")).timestamp()>=6*3600]
              # Preliminary age filter only; collect_evaluation.py verifies 24 closed candles.
              ids=[str(x["id"]) for x in mature]
              previous=subprocess.run(["gh","api",f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/evaluate-archived-scan.yml/runs",
                                      "-f","status=success","-f","per_page=100","--method","GET"],capture_output=True,text=True)
              done=set()
              if previous.returncode==0:
                  for past in json.loads(previous.stdout).get("workflow_runs",[]):
                      if past.get("id")==int(os.getenv("GITHUB_RUN_ID","0")):
                          continue
                      artifacts=subprocess.run(["gh","api",f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{past['id']}/artifacts"],
                                               capture_output=True,text=True)
                      if artifacts.returncode==0:
                          for artifact in json.loads(artifacts.stdout).get("artifacts",[]):
                              name=artifact.get("name","")
                              if name.startswith("evaluation-report-"):
                                  done.add(name.removeprefix("evaluation-report-"))
              ids=[x for x in ids if x not in done]
          os.makedirs("archive",exist_ok=True)
          for run_id in ids:
              try:
                  os.remove("archive/scan-result.json")
              except FileNotFoundError:
                  pass
              p=subprocess.run(["gh","run","download",run_id,"--repo",os.environ["GITHUB_REPOSITORY"],
                                "--name","latest-market-scan","--dir","archive"],capture_output=True,text=True)
              if p.returncode==0 and os.path.isfile("archive/scan-result.json") and os.path.getsize("archive/scan-result.json")>0:
                  with open("archive/scan-result.json") as source:
                      snapshot=json.load(source)
                  actionable=sum(s.get("side") in ("LONG","SHORT") for s in snapshot.get("signals",[]))
                  if actionable == 0:
                      print("Skipping scan without actionable signals:",run_id)
                      continue
                  print("Selected archived scan:",run_id,"actionable:",actionable)
                  with open(os.environ["GITHUB_OUTPUT"],"a") as out:
                      out.write(f"scan_id={run_id}\n")
                  sys.exit(0)
          print("No unevaluated mature scanner artifact available; skipping.")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("no_data=true\n")
          PY
        id: archive
      - name: Fetch matured closed Bybit candles
        if: steps.archive.outputs.no_data != 'true'
        run: python collect_evaluation.py archive/scan-result.json --output evaluation-input.json
      - name: Ensure actionable signals were collected
        if: steps.archive.outputs.no_data != 'true'
        run: |
          python - <<'PY'
          import json
          snapshot=json.load(open("archive/scan-result.json"))
          collected=json.load(open("evaluation-input.json"))
          expected=sum(s.get("side") in ("LONG","SHORT") for s in snapshot.get("signals",[]))
          actual=len(collected["signals"])
          print(f"Expected actionable signals: {expected}; collected: {actual}")
          if actual != expected or expected == 0:
              raise SystemExit("Incomplete or empty evaluation; retry on next workflow run")
          PY
      - name: Evaluate without trading
        if: steps.archive.outputs.no_data != 'true'
        run: python evaluation.py evaluation-input.json --output evaluation-result.json
      - name: Verify report is not falsely validated
        if: steps.archive.outputs.no_data != 'true'
        run: |
          python - <<'PY'
          import json
          d=json.load(open('evaluation-result.json'))
          assert d['summary']['validated_edge'] is False
          print('Evaluated:',d['summary']['evaluated'],'Unresolved:',d['summary']['unresolved'])
          PY
      - name: Summarize score bands (descriptive only)
        if: steps.archive.outputs.no_data != 'true'
        run: python analyze_evaluations.py evaluation-result.json --output research-summary.json
      - uses: actions/upload-artifact@v4
        if: steps.archive.outputs.no_data != 'true'
        with:
          name: evaluation-report-${{ steps.archive.outputs.scan_id }}
          path: |
            evaluation-input.json
            evaluation-result.json
            research-summary.json
          retention-days: 30
