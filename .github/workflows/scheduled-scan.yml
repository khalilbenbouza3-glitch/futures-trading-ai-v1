name: Scheduled futures scanner
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: scheduled-futures-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx==0.28.1
      - name: Request scan from Render and archive fresh result
        env:
          SCANNER_URL: https://futures-trading-ai-v1.onrender.com
        run: |
          python - <<'PY'
          import json, os, pathlib, time
          import httpx
          base=os.environ["SCANNER_URL"]
          with httpx.Client(timeout=httpx.Timeout(620.0,connect=30.0),follow_redirects=True) as client:
              response=client.post(base+"/scan")
              response.raise_for_status()
              scan_response=response.json()
              if scan_response.get("scan_executed") is not True:
                  raise SystemExit("Scan was already running; refuse to archive a duplicate snapshot")
              result=client.get(base+"/signals",timeout=30)
              result.raise_for_status()
              data=result.json()
          if not data.get("fresh") or data.get("status") not in ("ok","partial"):
              raise SystemExit("No fresh successful Render scanner snapshot; not archiving")
          if data.get("updated_at") != scan_response.get("updated_at"):
              raise SystemExit("Scan timestamp mismatch; refusing to archive another run")
          if not data.get("updated_at") or not isinstance(data.get("signals"),list):
              raise SystemExit("Invalid scanner payload")
          pathlib.Path("scan-result.json").write_text(json.dumps(data,indent=2))
          print("Archived Render scan",data["updated_at"],"signals",len(data["signals"]))
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: latest-market-scan
          path: scan-result.json
          retention-days: 2
          if-no-files-found: error
