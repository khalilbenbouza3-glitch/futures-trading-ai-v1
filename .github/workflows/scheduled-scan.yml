name: Scheduled futures scanner
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: scheduled-futures-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx==0.28.1
      - name: Request scan from Render and archive fresh result
        env:
          SCANNER_URL: https://futures-trading-ai-v1.onrender.com
        run: |
          python - <<'PY'
          import json, os, pathlib, time
          import httpx
          base=os.environ["SCANNER_URL"]
          # Render also starts its own periodic scans. Avoid treating a busy
          # scanner as a failed scan, but never archive an unrelated snapshot.
          scan_response=None
          with httpx.Client(timeout=httpx.Timeout(620.0,connect=30.0),follow_redirects=True) as client:
              for attempt in range(1,5):
                  response=client.post(base+"/scan")
                  response.raise_for_status()
                  candidate=response.json()
                  if candidate.get("scan_executed") is True:
                      scan_response=candidate
                      break
                  if candidate.get("warning") != "SCAN_ALREADY_RUNNING":
                      raise SystemExit("Scanner did not execute and did not report a recognized busy state")
                  print(f"SCAN_BUSY attempt={attempt}/4; waiting before retry",flush=True)
                  if attempt<4:
                      time.sleep(90)
              if scan_response is None:
                  # A busy scanner is not a new archived observation.
                  print("SCAN_BUSY_EXHAUSTED: no new scan; skipping artifact",flush=True)
                  pathlib.Path("scan-skipped.txt").write_text("SCAN_ALREADY_RUNNING after four attempts\\n")
              else:
                  result=client.get(base+"/signals",timeout=30)
                  result.raise_for_status()
                  data=result.json()
          if scan_response is None:
              raise SystemExit(0)
          if not data.get("fresh") or data.get("status") not in ("ok","partial"):
              raise SystemExit("No fresh successful Render scanner snapshot; not archiving")
          if data.get("updated_at") != scan_response.get("updated_at"):
              raise SystemExit("Scan timestamp mismatch; refusing to archive another run")
          if not data.get("updated_at") or not isinstance(data.get("signals"),list):
              raise SystemExit("Invalid scanner payload")
          pathlib.Path("scan-result.json").write_text(json.dumps(data,indent=2))
          from collections import Counter
          counts=Counter(str(s.get("side","MISSING")) for s in data["signals"])
          actionable=counts.get("LONG",0)+counts.get("SHORT",0)
          diagnostics={
              "updated_at":data["updated_at"],
              "status":data["status"],
              "pairs_scanned":data.get("pairs_scanned"),
              "signals_total":len(data["signals"]),
              "actionable_signals":actionable,
              "side_counts":dict(sorted(counts.items())),
              "scan_executed":scan_response["scan_executed"]
          }
          pathlib.Path("scan-diagnostics.json").write_text(json.dumps(diagnostics,indent=2))
          print("SCAN_DIAGNOSTICS",json.dumps(diagnostics,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: success() && hashFiles('scan-result.json') != ''
        with:
          name: latest-market-scan
          path: |
            scan-result.json
            scan-diagnostics.json
          retention-days: 2
          if-no-files-found: error
